<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Portfolio</title>
  <link rel="stylesheet" href="dflip/css/dflip.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stage-label">BOOK PORTFOLIO</div>

  <div id="portfolio-viewer"></div>

  <!-- ── SPATIAL TOOLTIP NAV ─────────────────────────────── -->
  <nav id="ctrl-nav" aria-label="Flipbook controls">
    <div id="ctrl-core">

      <!-- sliding tooltip label window -->
      <div id="ctrl-tooltip" aria-hidden="true">
        <ul id="ctrl-labels">
          <li><span>Cover</span></li>
          <li><span>Pages</span></li>
          <li><span>Zoom In</span></li>
          <li><span>Zoom Out</span></li>
          <li><span>Full Screen</span></li>
        </ul>
      </div>

      <!-- icon buttons -->
      <ul id="ctrl-buttons">

        <li><button class="ctrl-btn" id="ctrl-cover" title="Cover">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
          </svg>
          <span class="sr-only">Cover</span>
        </button></li>

        <li><button class="ctrl-btn" id="ctrl-pages" title="Pages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6Zm0 9.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25Zm9.75-9.75a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6Zm0 9.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/>
          </svg>
          <span class="sr-only">Pages</span>
        </button></li>

        <li><button class="ctrl-btn" id="ctrl-zoomin" title="Zoom In">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607ZM10.5 7.5v6m3-3h-6"/>
          </svg>
          <span class="sr-only">Zoom In</span>
        </button></li>

        <li><button class="ctrl-btn" id="ctrl-zoomout" title="Zoom Out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607ZM13.5 10.5h-6"/>
          </svg>
          <span class="sr-only">Zoom Out</span>
        </button></li>

        <li><button class="ctrl-btn" id="ctrl-fullscreen" title="Full Screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
          </svg>
          <span class="sr-only">Full Screen</span>
        </button></li>

      </ul>

      <!-- dark pill background (extends beyond buttons) -->
      <div class="ctrl-pill-bg"></div>
    </div>
  </nav>

  <script>window.dFlipLocation = './dflip/';</script>
  <script src="dflip/js/libs/jquery.min.js"></script>
  <script src="dflip/js/dflip.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
